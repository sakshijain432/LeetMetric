<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leetmetric Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!--h1-->
        <h1>LeetMetric</h1>
        <!--input field-->
        <div class="user-container">
            <p>Enter your Username </p>
            <div class="user-input-container">
                <input type="text" placeholder="enter your username here" id="user-input">
                <button id="search-btn">Search</button>
            </div>
        </div>

        <!--chart show-->
        <div class="stats-container">
                 
                <div class="progress">
                    <!--easy-->
                    <div class="progress-item">
                        <div class="easy-progress circle">
                            <span id="easy-label"></span>
                            <p>Easy</p>
                        </div>
                    </div>
                     <!--medium-->
                    <div class="progress-item">
                        <div class="medium-progress circle">
                            <span id="medium-label"></span>
                            <p>Medium</p>
                        </div>
                    </div>
                    <!--hard-->
                    <div class="progress-item">
                        <div class="hard-progress circle">
                            <span id="hard-label"></span>
                            <p>Hard</p>
                        </div>
                    </div>

                </div>

                <!--card -->
                <div class="stats-cards">
                    <!--directly from JS Code -->
                </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
